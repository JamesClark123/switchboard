// Kit RPCs (ValidateKit, AddSandboxKit, LaunchSandbox with kits) gain one behavior:
// FAILED_PRECONDITION naming the host's and the minimum runtime version when the
// baseline is unmet (FR-096). KitSpec.spec_yaml is now always schema version 2
// (FR-091); the daemon still writes it verbatim.
