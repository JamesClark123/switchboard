// ---------------------------------------------------------------------------
// RPCs (added to service Switchboard)
// ---------------------------------------------------------------------------

// ListSandboxServices returns every service declared by a sandbox's attached
// kits, joined with its current instance state (FR-045). The set is exactly
// Sandbox.services — no more.
message ListSandboxServicesRequest { string sandbox_id = 1; }
message ListSandboxServicesResponse { repeated SandboxService services = 1; }

// StartSandboxService starts one declared service by NAME. The name is validated
// against the sandbox's persisted service set; an unknown name starts nothing and
// returns NOT_FOUND. Idempotent: starting a STARTING/RUNNING service returns the
// existing instance unchanged (FR-048).
//
// Returns as soon as the instance exists (STARTING); readiness is reported
// asynchronously via Event.service_instance, exactly as escape-hatch runs are.
message StartSandboxServiceRequest {
  string sandbox_id = 1;
  string service_name = 2;
}
message StartSandboxServiceResponse { ServiceInstance instance = 1; }

// StopSandboxService terminates the whole process tree — graceful signal, bounded
// grace period, then force-kill — and releases the port only once the listen port
// is observed free (FR-048, clarification Q4). Idempotent on an already-stopped
// service.
message StopSandboxServiceRequest {
  string sandbox_id = 1;
  string service_name = 2;
}
message StopSandboxServiceResponse { ServiceInstance instance = 1; }

// ForwardPort is the byte relay that puts a running service on a port on the
// DEVELOPER'S machine (research R1). One stream per accepted TCP connection:
//
//   client                                   daemon
//   ──────────────────────────────────────────────────────────────────
//   open{instance_id, local_port}   ──────►  dial 127.0.0.1:<host_endpoint_port>
//                                   ◄──────  opened{} | error{...}
//   data ◄──────────────────────────────────► data          (until either closes)
//
// The first client frame MUST be `open`; anything else is INVALID_ARGUMENT. The
// daemon rejects an instance that is not RUNNING (FAILED_PRECONDITION), which is
// what stops a stale client from presenting a dead address as working.
//
// local_port is reported so the daemon can echo it on the instance for display;
// the client remains the sole allocator of ports on the developer's machine.
message PortForwardFrame {
  oneof frame {
    Open open = 1;       // client → daemon, first frame only
    Opened opened = 2;   // daemon → client, once, after a successful dial
    bytes data = 3;      // both directions
    Closed closed = 4;   // either direction; carries a reason when abnormal
  }
  message Open {
    string instance_id = 1;
    uint32 local_port = 2;   // the port the client bound on the developer's machine
  }
  message Opened {}
  message Closed { string reason = 1; }  // empty => normal half-close
}

// service Switchboard {
//   ... existing RPCs ...
     rpc ListSandboxServices(ListSandboxServicesRequest) returns (ListSandboxServicesResponse);
     rpc StartSandboxService(StartSandboxServiceRequest) returns (StartSandboxServiceResponse);
     rpc StopSandboxService(StopSandboxServiceRequest) returns (StopSandboxServiceResponse);
     rpc ForwardPort(stream PortForwardFrame) returns (stream PortForwardFrame);
// }
