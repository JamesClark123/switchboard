// Contract revision for feature 005 (Escape Hatch).
//
// This file is a REVISION DOC, not a compiled input: it records only what feature
// 005 ADDS to the live contract at
// src/libs/switchboard-proto/proto/switchboard.proto (the single source of truth,
// regenerated via `make proto`). Mirrors the revision-doc pattern features 003/004
// used (switchboard-terminal.proto, switchboard-kits.proto).
//
// Design notes (see research.md):
//  - Escape-hatch commands are STRUCTURED and switchboard-owned; they ride the
//    client-authored KitSpec, NOT the opaque spec.yaml `sbx` validates (R2).
//  - The AI invokes a command over the existing agent-hook HTTP channel, not gRPC
//    (see contracts/escape-hatch-http.md); the daemon pushes the result back into
//    the agent via the existing PromptAgent PTY path (R1). So there is NO gRPC RPC
//    for invocation — the gRPC additions here are for the CLIENT: consent decisions
//    and observability.

syntax = "proto3";

package switchboard.v1;

// ---------- Added to service Switchboard ----------

// Approve or deny a REQUIRES_APPROVAL run that is PENDING_APPROVAL (FR-039). The
// daemon blocks the run on a 5-minute decision window (deny-by-default); this RPC
// is the client's input to that gate. Approving proceeds to execution; denying (or
// letting the window elapse) yields a DENIED run and a "declined" callback to the
// agent. Idempotent: a decision on an already-resolved run is a no-op.
//
//   rpc DecideEscapeHatchRun(DecideEscapeHatchRunRequest) returns (DecideEscapeHatchRunResponse);
//
// List the escape-hatch runs for a sandbox in the current daemon session (FR-042).
// Runs are in-memory only ("session" = daemon uptime, clarification Q2), so this is
// review-within-session, not durable history.
//
//   rpc ListEscapeHatchRuns(ListEscapeHatchRunsRequest) returns (ListEscapeHatchRunsResponse);

// ---------- Added enums ----------

enum ConsentMode {
  CONSENT_MODE_UNSPECIFIED = 0;      // rejected at attach — author must choose
  CONSENT_MODE_AUTO_RUN = 1;         // runs without per-invocation approval
  CONSENT_MODE_REQUIRES_APPROVAL = 2;// pauses for developer approval each invocation
}

enum EscapeHatchRunStatus {
  ESCAPE_HATCH_RUN_STATUS_UNSPECIFIED = 0;
  ESCAPE_HATCH_RUN_STATUS_PENDING_APPROVAL = 1;
  ESCAPE_HATCH_RUN_STATUS_RUNNING = 2;
  ESCAPE_HATCH_RUN_STATUS_SUCCEEDED = 3;
  ESCAPE_HATCH_RUN_STATUS_FAILED = 4;      // non-zero exit OR launch failure (diagnostics in output)
  ESCAPE_HATCH_RUN_STATUS_TIMED_OUT = 5;
  ESCAPE_HATCH_RUN_STATUS_CANCELLED = 6;   // sandbox stopped/destroyed/refreshed mid-run
  ESCAPE_HATCH_RUN_STATUS_DENIED = 7;      // approval denied or window elapsed
}

// ---------- Added messages ----------

// EscapeHatchCommand: one authorized command declared on a kit (data-model §1).
// The `command` string is FIXED — the agent chooses which command by name and
// when, never what it is. Carried on KitSpec and, once resolved, on Sandbox.
message EscapeHatchCommand {
  string name = 1;                 // stable, kebab-case; unique within a kit; the allowlist key
  string command = 2;             // fixed, trusted command prefix, run via `sh -c`
  string when_to_use = 3;         // plain-language guidance for the injected rule
  ConsentMode consent_mode = 4;
  string working_dir = 5;         // optional, workspace-relative (no escape past root); default when `workspaces` empty
  uint32 max_duration_seconds = 6;// optional; 0 => daemon default (30 min)
  // Agent-supplied arguments (enhancement). At most ONE of the two; both empty =>
  // the command takes no agent arguments. Any supplied argument is passed as
  // positional parameters (`sh -c '<command> "$@"' … <args>`), never re-parsed as
  // shell syntax — a loose pattern broadens which arguments reach the fixed command
  // but cannot inject shell metacharacters.
  repeated string subcommands = 7; // allowed exact argument strings (friendly form)
  string args_pattern = 8;         // anchored regex the argument string must fully match (power form)
  // Targetable workspaces (enhancement): workspace-relative literal paths OR globs
  // (e.g. "src/apps/*"). Empty => run in `working_dir`, no workspace selection.
  repeated string workspaces = 9;
}

// EscapeHatchRun: one execution triggered by the agent (data-model §3). In-memory,
// session-scoped. `output` is bounded (<=1 MiB) and may be truncated.
message EscapeHatchRun {
  string id = 1;                  // ehr-<seq>
  string sandbox_id = 2;
  string command_name = 3;
  string command = 4;            // the exact string that ran (audit; agent could not alter it)
  EscapeHatchRunStatus status = 5;
  int32 exit_status = 6;         // set for SUCCEEDED/FAILED
  string output = 7;             // bounded, captured stdout+stderr
  bool output_truncated = 8;
  google.protobuf.Timestamp started_at = 9; // execution start (post-approval)
  google.protobuf.Timestamp ended_at = 10;  // terminal outcome
}

message DecideEscapeHatchRunRequest {
  string run_id = 1;
  bool approved = 2;              // false = deny; anything but an explicit true is deny-by-default
}
message DecideEscapeHatchRunResponse {
  EscapeHatchRunStatus status = 1;// resolved status after applying the decision
}

message ListEscapeHatchRunsRequest { string sandbox_id = 1; }  // empty => all sandboxes on this host
message ListEscapeHatchRunsResponse { repeated EscapeHatchRun runs = 1; }

// ---------- Added fields on existing messages ----------

// message KitSpec — next free field number was 3:
//
//   // Structured, switchboard-owned escape-hatch commands (R2). NOT rendered into
//   // spec_yaml — the host `sbx` never sees them; the daemon enforces + runs them.
//   // Present only on client-authored kits (KitRef.spec); external `source` kits
//   // carry none.
//   repeated EscapeHatchCommand escape_hatch = 3;

// message Sandbox — next free field number was 19 (kits took 18):
//
//   // The RESOLVED escape-hatch command set for this sandbox = union of attached
//   // kits' commands, later-kit-wins on name collision (clarification Q1).
//   // Persisted so the allowlist is enforceable, a container recreate replays it,
//   // and refresh can re-inject the rule + wrapper. This — not the opaque `kits`
//   // list — is what the invocation endpoint validates against (FR-036).
//   repeated EscapeHatchCommand escape_hatch_commands = 19;

// message Event.event oneof — next free field number was 4 (removed took 3):
//
//   // A run's state changed (created / approved / running / terminal). Lets the
//   // list page show a live "running"/"awaiting approval" badge and drives the
//   // approval modal + inbox, reusing the feature-003 event pump (R6).
//   EscapeHatchRun escape_hatch_run = 4;

// enum NotificationKind — next free values were 3 and 4:
//
//   NOTIFICATION_KIND_ESCAPE_HATCH_NEEDS_APPROVAL = 3; // FR-039: prompt the developer
//   NOTIFICATION_KIND_ESCAPE_HATCH_RUN_COMPLETE   = 4; // FR-042: run finished (any terminal outcome)

// ---------- Compatibility ----------
//
// Every change is additive: new RPCs, new enums, new messages, and new field
// numbers on the tail of existing messages. The bbolt registry persists *pb.Sandbox
// directly, so Sandbox.escape_hatch_commands joins the stored schema automatically
// and proto's unknown-field tolerance means pre-feature records decode fine (empty
// set). No migration is required — identical to how feature 004 added Sandbox.kits.
