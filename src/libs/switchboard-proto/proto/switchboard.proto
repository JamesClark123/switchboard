// Switchboard daemon <-> TUI client contract.
//
// Transport: gRPC over a single bidirectional connection.
//   - Local:  Unix domain socket  (switchboardd serve --socket <path>)
//   - Remote: `ssh <host> switchboardd dial-stdio` bridges stdio <-> the
//             remote daemon's Unix socket (the Docker-CLI dial-stdio pattern);
//             the client wraps that stdio as a net.Conn via grpc.WithContextDialer.
//
// One daemon instance serves exactly one host. The client connects to N daemons
// and is the source of truth for configs/groups/known-hosts (those are NOT in
// this contract — they live client-side). This contract covers what the daemon
// owns: sandbox lifecycle, the sbx option manifest, agent I/O, and the event stream.
//
// Mirrored at src/libs/switchboard-proto/proto/switchboard.proto.

syntax = "proto3";

package switchboard.v1;

option go_package = "github.com/jamesclark123/switchboard/libs/switchboard-proto/gen;switchboardv1";

import "google/protobuf/timestamp.proto";

service Switchboard {
  // --- Identity / capability ---
  rpc GetDaemonInfo(GetDaemonInfoRequest) returns (DaemonInfo);
  // Full sbx option surface so the client editor covers 100% of kit options (FR-014).
  rpc GetOptionManifest(GetOptionManifestRequest) returns (OptionManifest);
  // Self-update this daemon's binary to a target release and restart. Streams
  // progress; the connection drops when the daemon restarts on the new binary.
  rpc UpdateDaemon(UpdateDaemonRequest) returns (stream UpdateProgress);

  // --- Sandbox lifecycle (FR-001, FR-012a-f) ---
  rpc ListSandboxes(ListSandboxesRequest) returns (ListSandboxesResponse);
  // Server-streams progress (copy %, sbx output) then a terminal Sandbox (FR-028).
  rpc LaunchSandbox(LaunchSandboxRequest) returns (stream LaunchProgress);
  rpc StopSandbox(SandboxIdRequest) returns (Sandbox);     // retains copy (FR-012a)
  rpc RestartSandbox(SandboxIdRequest) returns (stream LaunchProgress); // from retained copy (FR-012b)
  rpc DestroySandbox(SandboxIdRequest) returns (DestroyResponse);       // deletes copy (FR-012c)
  rpc RenameSandbox(RenameSandboxRequest) returns (Sandbox);            // custom display name (FR-012e)
  // DESTRUCTIVE (feature 004, FR-030): deletes the retained workspace copy and
  // re-seeds it from the recorded sources, then brings the sandbox back up on the
  // SAME container so installed packages / agent history survive. Streams copy
  // progress + sbx logs then a terminal Sandbox, exactly like LaunchSandbox.
  // Clients MUST confirm with the user before calling this.
  rpc RefreshSandbox(SandboxIdRequest) returns (stream LaunchProgress);

  // --- Agent kits (feature 004, FR-031..034) ---
  // Kits are authored and owned CLIENT-side (like configs); the daemon only
  // materializes a KitSpec's spec.yaml into a directory the host `sbx` can consume.
  // Validate a kit without attaching it (`sbx kit validate`), for editor feedback.
  rpc ValidateKit(ValidateKitRequest) returns (ValidateKitResponse);
  // Attach a kit to an ALREADY-RUNNING sandbox (`sbx kit add`). sbx restarts the
  // sandbox to apply it; VM state is preserved. Kits CANNOT be removed from a
  // running sandbox — destroy and recreate to start clean. Streams sbx logs then
  // a terminal Sandbox.
  rpc AddSandboxKit(AddSandboxKitRequest) returns (stream LaunchProgress);

  // --- Source discovery for the launch wizard (FR-007) ---
  rpc ListSourceCandidates(ListSourceCandidatesRequest) returns (ListSourceCandidatesResponse);
  // Pre-launch disk/resource check; returns warnings the client may override (FR-012f).
  rpc CheckResources(CheckResourcesRequest) returns (ResourceReport);

  // --- Sandbox tag (FR-021..024, feature 003): mutable, non-unique purpose label. ---
  rpc SetSandboxTag(SetSandboxTagRequest) returns (Sandbox);

  // --- Workspace -> sandbox resolution for `sxb` auto-open (FR-017/018, feature 003). ---
  rpc ResolveWorkspace(ResolveWorkspaceRequest) returns (ResolveWorkspaceResponse);

  // --- Agent interaction (FR-022, FR-023) ---
  rpc PromptAgent(PromptAgentRequest) returns (PromptAgentResponse);
  // Bidirectional PTY stream for the persistent terminal session (feature 003):
  // the first AgentOutput frame is a Snapshot (current-screen + scrollback redraw),
  // then live `data` frames follow. The session survives client detach.
  rpc AttachAgent(stream AgentInput) returns (stream AgentOutput);

  // --- Live updates: sandbox state changes + agent notifications (FR-024-026b, SC-008) ---
  // On (re)subscribe the daemon replays undelivered NotificationEvents (FR-026b).
  rpc Subscribe(SubscribeRequest) returns (stream Event);
  rpc AckNotification(AckNotificationRequest) returns (AckNotificationResponse);

  // --- VS Code open helper (FR-027): daemon returns the container name + in-container
  //     workspace path; the CLIENT builds the vscode-remote URI and runs `code` locally. ---
  rpc GetVSCodeTarget(SandboxIdRequest) returns (VSCodeTarget);

  // --- Escape hatch (feature 005) ---
  // The AI INVOKES a command over the agent-hook HTTP server (POST /escape-hatch/run,
  // see specs/005-escape-hatch/contracts/escape-hatch-http.md), NOT gRPC. These RPCs
  // are the CLIENT surface: approve/deny a gated run, and review runs this session.
  //
  // Approve or deny a REQUIRES_APPROVAL run that is PENDING_APPROVAL (FR-039). The
  // daemon blocks the run on a 5-minute deny-by-default window; this is the client's
  // input to that gate. Idempotent on an already-resolved run.
  rpc DecideEscapeHatchRun(DecideEscapeHatchRunRequest) returns (DecideEscapeHatchRunResponse);
  // List escape-hatch runs for a sandbox in the current daemon session (FR-042).
  // Runs are in-memory only ("session" = daemon uptime); empty sandbox_id => all
  // sandboxes on this host.
  rpc ListEscapeHatchRuns(ListEscapeHatchRunsRequest) returns (ListEscapeHatchRunsResponse);

  // --- Port forwarding (feature 006) ---
  // Services are DECLARED on a kit and started only by the developer's explicit
  // selection (FR-045) — nothing here is reachable by the sandbox's agent.
  //
  // Every service the sandbox's attached kits declare, joined with its current
  // instance state. The set is exactly Sandbox.services — no more.
  rpc ListSandboxServices(ListSandboxServicesRequest) returns (ListSandboxServicesResponse);
  // Start one declared service by NAME, validated against the sandbox's persisted
  // service set (an unknown name starts nothing => NOT_FOUND). Returns as soon as
  // the instance exists (STARTING); readiness arrives via Event.service_instance.
  // Idempotent: a STARTING/RUNNING service returns its existing instance (FR-048).
  rpc StartSandboxService(StartSandboxServiceRequest) returns (StartSandboxServiceResponse);
  // Terminate the whole process tree — graceful signal, bounded grace period, then
  // force-kill — releasing the port only once the listen port is observed free
  // (FR-048). Idempotent on an already-stopped service.
  rpc StopSandboxService(StopSandboxServiceRequest) returns (StopSandboxServiceResponse);
  // Byte relay that puts a RUNNING service on a port on the DEVELOPER'S machine.
  // One stream per accepted TCP connection; see PortForwardFrame.
  rpc ForwardPort(stream PortForwardFrame) returns (stream PortForwardFrame);

  // --- Edit sandbox sources (feature 007, FR-053..FR-067) ---
  // Both RPCs edit the seeded folder set of an EXISTING sandbox IN PLACE — the
  // sandbox is never stopped, restarted, or recreated (FR-054), and its state
  // never changes (no CREATING/ERROR transitions; a failed add leaves the sandbox
  // exactly as it was, FR-058). Eligible states: RUNNING, STOPPED. While another
  // add/remove/refresh is in flight for the same sandbox, both return
  // FAILED_PRECONDITION naming the in-flight operation (FR-066). Completed edits
  // reach other clients through the existing Event.sandbox_changed arm (FR-067);
  // edits are developer-initiated and therefore raise no inbox notification.
  //
  // Seed additional folders into an existing sandbox's workspace, honoring the
  // sandbox's recorded seeding mode (duplicate => verbatim copy; clone => repo
  // clone, non-repos refused). Streams the SAME LaunchProgress shape as
  // LaunchSandbox/RefreshSandbox: `copy` for duplication progress (FR-055),
  // `log_line` for clone/sbx-free host output, `blocked` (instead of `done`) when
  // the resource gate trips without override (FR-057), then a terminal `done`
  // carrying the updated Sandbox (its `sources` now includes the additions).
  //
  // Refused BEFORE any byte is copied (FR-056) — INVALID_ARGUMENT /
  // ALREADY_EXISTS / FAILED_PRECONDITION naming the offending folder — when: a
  // path is missing or not a directory; a folder name collides with a recorded
  // source, an on-disk top-level workspace entry, or another selection in the
  // same request; the folder name is the reserved ".switchboard"; a clone-mode
  // add is not a git repository (re-verified daemon-side); or the sandbox state
  // is CREATING/DESTROYING/ERROR.
  //
  // Failure atomicity (FR-058): the copy stages inside the workspace's reserved
  // internal folder and is renamed into place only when complete, so a live agent
  // never observes a partially copied seeded folder, and any failure removes all
  // staged/renamed content from this operation, leaving record and workspace
  // untouched.
  rpc AddSandboxSources(AddSandboxSourcesRequest) returns (stream LaunchProgress);
  // Delete seeded folders' copies from an existing sandbox's workspace and drop
  // them from the record. DESTRUCTIVE for the sandbox's copy (never the origin):
  // the CLIENT is responsible for the FR-060 confirmation before calling — the
  // daemon does not re-confirm (the RefreshSandbox precedent).
  //
  // Targets are EXACT recorded SourceRef.path values; an unknown path is
  // NOT_FOUND and nothing in the batch is deleted. Refused up front when the
  // batch would leave the sandbox with zero seeded folders (FR-061,
  // FAILED_PRECONDITION) or while a declared service instance is starting or
  // running with its working directory at or beneath a selected folder (FR-062,
  // FAILED_PRECONDITION naming the service and the remedy). A folder whose copy
  // is already missing on disk is dropped from the record and counts as success
  // (FR-063). On a mid-batch deletion failure the folders already deleted STAY
  // dropped from the record — the record follows the disk (research R3) — and the
  // error names the folder that failed.
  //
  // Returns the updated Sandbox (its `sources` reflect exactly what remains).
  rpc RemoveSandboxSources(RemoveSandboxSourcesRequest) returns (Sandbox);

  // --- MCP gateway (feature 008, FR-072..FR-100) ---
  // Each daemon owns ONE gateway manager scoped to its host: every RPC below acts
  // on this host's `sbx mcp` registrations only. Registrations are the host
  // runtime's truth (read via `sbx mcp ls` on every list); switchboard owns only
  // the per-daemon attach-by-default marks and default attach mode
  // (McpGatewaySettings). All of them answer FAILED_PRECONDITION carrying
  // DaemonInfo.mcp_gateway_reason when the gateway cannot be managed here
  // (CLI missing, below the runtime baseline, not signed in — FR-079); an older
  // daemon answers UNIMPLEMENTED (the `u` update fan-out is the remedy).
  //
  // Lists registered servers decorated with marks (stale marks are dropped on
  // read) plus the daemon's settings (FR-073).
  rpc ListMcpServers(ListMcpServersRequest) returns (ListMcpServersResponse);
  // Registers a server WITHOUT authorizing (always `--skip-auth`; authorization
  // is the separate AuthorizeMcpServer step, research R2) and optionally marks it
  // attach-by-default (FR-074/FR-080). A host-run `command` server requires
  // acknowledge_local_execution = true (FR-076). Host diagnostics travel verbatim
  // in the error (FR-078).
  rpc AddMcpServer(AddMcpServerRequest) returns (McpServer);
  // Removes a registration and clears its mark (FR-074); the runtime's notes
  // about leftover credential material are relayed in `notes`.
  rpc RemoveMcpServer(RemoveMcpServerRequest) returns (RemoveMcpServerResponse);
  // Runs the host's authorization flow for a registered server (FR-075): streams
  // the authorization URL as soon as the runtime prints it (open it where YOU are;
  // never auto-opened on the host), then progress, then a terminal frame. Bounded
  // at 10 minutes daemon-side; cancelling the stream cancels the wait. The
  // registration is never changed by any outcome.
  rpc AuthorizeMcpServer(AuthorizeMcpServerRequest) returns (stream McpAuthProgress);
  // Sets or clears the attach-by-default mark (FR-080). NOT_FOUND when the name
  // is not registered on this host.
  rpc SetMcpServerDefault(SetMcpServerDefaultRequest) returns (McpServer);
  // Sets the daemon's default attach mode (FR-100). Never touches existing sandboxes.
  rpc SetMcpAttachMode(SetMcpAttachModeRequest) returns (McpGatewaySettings);
  // Attaches a registered server to an EXISTING sandbox (`sbx mcp load <name>
  // --sandbox <name>`, FR-102): works on RUNNING/STOPPED sandboxes in either
  // attach mode, appends the name to Sandbox.mcp_servers and emits
  // Event.sandbox_changed. NOT_FOUND when the server is not registered on this
  // host, ALREADY_EXISTS when switchboard already recorded it on the sandbox,
  // FAILED_PRECONDITION for an ineligible state or a busy sandbox. The gateway
  // delivers the new tools live; the agent is never restarted. There is no detach.
  rpc AttachMcpServer(AttachMcpServerRequest) returns (Sandbox);

  // ---------- Secrets (feature 008, FR-104) ----------
  // The host runtime's secret store (`sbx secret`), managed per daemon like the
  // gateway. Values travel only inside SetSecretRequest over the daemon
  // connection (unix socket / SSH tunnel), are written to the CLI's stdin, and
  // are never logged, stored, or echoed back: `ls` reports masked values only.
  // Every handler answers FAILED_PRECONDITION with the reason when the host's
  // `sbx` is missing or below the runtime baseline.
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // Stores (or overwrites) a service secret, globally or for one sandbox.
  rpc SetSecret(SetSecretRequest) returns (Secret);
  // Removes a stored secret (service by name, or a registry credential by host).
  rpc RemoveSecret(RemoveSecretRequest) returns (RemoveSecretResponse);

  // --- Orchestrator (feature 009, FR-105..FR-157) ---
  // Two sides, two daemons. ORCHESTRATOR-SIDE RPCs are served by the daemon that
  // hosts the orchestrator (the TUI calls them over its existing connection to
  // that machine). WORKER-SIDE RPCs are served by EVERY daemon for the sandboxes
  // it owns and are called by an orchestrator's daemon over the SSH link it
  // opened (`ssh <host> sxbd dial-stdio`, research R2) or in-process for its own
  // host; the TUI calls only DetachController directly, and only when the
  // orchestrator is unreachable (FR-112). An older daemon answers every new RPC
  // with UNIMPLEMENTED, surfaced as "daemon on <host> is too old"; the `u`
  // update fan-out is the remedy.

  // ===== Orchestrator-side (served by the hosting daemon; FR-105, FR-142) =====

  // Every orchestrator this daemon hosts, with derived counts (FR-142).
  rpc ListOrchestrators(ListOrchestratorsRequest) returns (ListOrchestratorsResponse);
  // One orchestrator with its workers (availability derived, R7) and host
  // entries (reachability derived from the link state, R2/R6).
  rpc GetOrchestrator(OrchestratorIdRequest) returns (OrchestratorDetail);
  // Creates the record, assigns the opaque identity (FR-148), starts the runtime
  // and launches the default reasoning sandbox asynchronously (R11). ALREADY_EXISTS
  // when the name is taken on this daemon; the TUI checks every connected daemon
  // first so the name is unique among the orchestrators it knows.
  rpc CreateOrchestrator(CreateOrchestratorRequest) returns (Orchestrator);
  // Changes the label only (FR-148); workers' records and briefings are refreshed
  // through their links as they are reachable (UpdateWorker).
  rpc RenameOrchestrator(RenameOrchestratorRequest) returns (Orchestrator);
  // DESTRUCTIVE (FR-153): detaches every reachable worker (DetachController),
  // destroys the reasoning sandbox, fails in-flight runs, cancels queued runs,
  // discards actions/events/history. The CLIENT confirms. Workers on hosts that
  // are unreachable keep the controller until that daemon is reached again by
  // this orchestrator's identity (never) or detached by hand.
  rpc RemoveOrchestrator(OrchestratorIdRequest) returns (RemoveOrchestratorResponse);
  // Replaces the orchestrator's host entries (FR-106). Removing an entry whose
  // host still has workers is FAILED_PRECONDITION naming them.
  rpc SetOrchestratorHosts(SetOrchestratorHostsRequest) returns (Orchestrator);

  // The controller bundle (identity, name, host, briefing) a launching sandbox
  // carries in LaunchSandboxRequest.controller so it is a worker before its agent
  // starts (FR-110). The orchestrator adopts the sandbox on its next reconcile or
  // on an explicit AttachWorker (idempotent for the same controller).
  rpc GetWorkerBundle(GetWorkerBundleRequest) returns (WorkerBundle);
  // Attaches an EXISTING sandbox: dials the sandbox's host over the orchestrator's
  // own entry (FAILED_PRECONDITION "no host entry for <host>" when missing;
  // UNAVAILABLE with the SSH error when the dial fails), then AttachController on
  // the owning daemon. ALREADY_EXISTS names the current controller (FR-108).
  // Never stops, restarts or recreates the sandbox (FR-109).
  rpc AttachWorker(AttachWorkerRequest) returns (WorkerView);
  // Detaches a worker. FAILED_PRECONDITION naming the run while one is in flight
  // on it (FR-111). Refused for the reasoning sandbox (FR-145).
  rpc DetachWorker(DetachWorkerRequest) returns (DetachWorkerResponse);
  // Closes the run AWAITING_REVIEW on a worker as COMPLETED (default) or FAILED,
  // with the developer's note as its summary and closed_by_developer = true, and
  // frees the worker (FR-156). FAILED_PRECONDITION when no run awaits review there.
  rpc MarkWorkerFree(MarkWorkerFreeRequest) returns (Run);

  // Creates or replaces an action (validated at save, FR-121/137/138; INVALID_ARGUMENT
  // names the problem). Runs already created are untouched (FR-140).
  rpc PutAction(PutActionRequest) returns (Action);
  // Deletes an action; timed events naming it are disabled with that reason;
  // queued runs keep their composed prompt (edge cases).
  rpc DeleteAction(DeleteActionRequest) returns (DeleteActionResponse);
  // Creates or replaces a timed event (interval >= 60 s; the action must exist).
  rpc PutTimedEvent(PutTimedEventRequest) returns (TimedEvent);
  rpc DeleteTimedEvent(DeleteTimedEventRequest) returns (DeleteTimedEventResponse);

  // A USER event (FR-129): validates the call, composes the prompt at call time,
  // queues the run and returns it with its position. INVALID_ARGUMENT names a
  // missing required argument, an undeclared argument, an oversized value or an
  // unknown action; nothing is queued on refusal.
  rpc CallAction(CallActionRequest) returns (Run);
  // The three Queue-view groups (FR-131): queued in order with positions, in
  // flight, and history newest first within retention (FR-127).
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // One run including its composed prompt.
  rpc GetRun(GetRunRequest) returns (Run);
  // Cancels a QUEUED run (FR-126); FAILED_PRECONDITION for any other state.
  rpc CancelRun(CancelRunRequest) returns (Run);
  // Rebuilds the reasoning sandbox — destroy + launch with the saved setup, or
  // with `setup` when given (saved first) (FR-146). Streams LaunchProgress like
  // LaunchSandbox. FAILED_PRECONDITION while a run is on the sandbox.
  rpc RebuildReasoningSandbox(RebuildReasoningSandboxRequest) returns (stream LaunchProgress);

  // ===== Worker-side (served by every daemon for sandboxes it owns; R3) =====

  // Records the controller on the sandbox (compare-and-set: ALREADY_EXISTS names
  // the current controller, FR-108), mints the worker token, registers and loads
  // the per-worker gateway server (R4) and writes the briefing (R12). Idempotent
  // for the same controller. Emits Event.sandbox_changed. Works in any sandbox
  // state; the gateway load is skipped and retried at next bring-up when the
  // sandbox is not running.
  rpc AttachController(AttachControllerRequest) returns (Sandbox);
  // Clears the controller, removes the registration, strips the briefing.
  // FAILED_PRECONDITION for a reasoning sandbox unless force (orchestrator
  // removal). Callable by the TUI directly when the orchestrator is unreachable.
  rpc DetachController(DetachControllerRequest) returns (Sandbox);
  // Updates the last-known name, the current run (set/clear, needs_review) and/or
  // the briefing. Emits Event.sandbox_changed. PERMISSION_DENIED when
  // orchestrator_id is not the recorded controller.
  rpc UpdateWorker(UpdateWorkerRequest) returns (Sandbox);
  // Guarded delivery (R7): FAILED_PRECONDITION unless the sandbox is RUNNING, its
  // agent IDLE, the controller matches and no run is recorded on it. Ensures the
  // PTY is drained, types the framed prompt through the developer's own prompt
  // path, records controller.run and emits Event.sandbox_changed.
  rpc DeliverWorkerPrompt(DeliverWorkerPromptRequest) returns (DeliverWorkerPromptResponse);
  // The call relay (R6). The ORCHESTRATOR'S daemon is the client; the first frame
  // MUST be `hello`. See OrchestratorLinkFrame.
  rpc OrchestratorLink(stream OrchestratorLinkFrame) returns (stream OrchestratorLinkFrame);
}

// ---------- Enums ----------

enum SeedingMode {
  SEEDING_MODE_UNSPECIFIED = 0;
  SEEDING_MODE_DUPLICATE = 1; // default (FR-009): verbatim copy into controlled folder
  SEEDING_MODE_CLONE = 2;     // sbx clone option (FR-008)
}

enum SandboxState {
  SANDBOX_STATE_UNSPECIFIED = 0;
  SANDBOX_STATE_CREATING = 1;
  SANDBOX_STATE_RUNNING = 2;
  SANDBOX_STATE_STOPPED = 3;
  SANDBOX_STATE_DESTROYING = 4;
  SANDBOX_STATE_ERROR = 5;
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_IDLE = 1;         // task complete / awaiting nothing
  AGENT_STATUS_WORKING = 2;
  AGENT_STATUS_NEEDS_INPUT = 3;  // needs prompting (FR-025)
  AGENT_STATUS_EXITED = 4;
}

enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  NOTIFICATION_KIND_TASK_COMPLETE = 1;    // FR-024
  NOTIFICATION_KIND_NEEDS_PROMPTING = 2;  // FR-025
  // --- feature 005 ---
  NOTIFICATION_KIND_ESCAPE_HATCH_NEEDS_APPROVAL = 3; // FR-039: prompt the developer
  NOTIFICATION_KIND_ESCAPE_HATCH_RUN_COMPLETE = 4;   // FR-042: run finished (any terminal outcome)
  // --- feature 006 ---
  // FR-052: a service entered FAILED. Failures only — a successful start and a
  // developer-initiated stop are silent (they are actions the developer just took).
  NOTIFICATION_KIND_SERVICE_FAILED = 5;
  // --- feature 009 ---
  // FR-133: raised by the ORCHESTRATOR'S daemon with the worker's sandbox_id /
  // host_id so the inbox lands on the row. Reported completions are silent.
  NOTIFICATION_KIND_RUN_FAILED = 6;
  NOTIFICATION_KIND_RUN_AWAITING_REVIEW = 7;
  NOTIFICATION_KIND_RUN_NEEDS_INPUT = 8;
}

// --- Escape hatch (feature 005) ---

enum ConsentMode {
  CONSENT_MODE_UNSPECIFIED = 0;       // rejected at attach — author must choose
  CONSENT_MODE_AUTO_RUN = 1;          // runs without per-invocation approval
  CONSENT_MODE_REQUIRES_APPROVAL = 2; // pauses for developer approval each invocation
}

enum EscapeHatchRunStatus {
  ESCAPE_HATCH_RUN_STATUS_UNSPECIFIED = 0;
  ESCAPE_HATCH_RUN_STATUS_PENDING_APPROVAL = 1;
  ESCAPE_HATCH_RUN_STATUS_RUNNING = 2;
  ESCAPE_HATCH_RUN_STATUS_SUCCEEDED = 3;
  ESCAPE_HATCH_RUN_STATUS_FAILED = 4;    // non-zero exit OR launch failure (diagnostics in output)
  ESCAPE_HATCH_RUN_STATUS_TIMED_OUT = 5;
  ESCAPE_HATCH_RUN_STATUS_CANCELLED = 6; // sandbox stopped/destroyed/refreshed mid-run
  ESCAPE_HATCH_RUN_STATUS_DENIED = 7;    // approval denied or window elapsed
}

// --- Port forwarding (feature 006) ---

// Where a declared service's command runs (FR-043, FR-046). UNSPECIFIED is
// rejected at authoring and at attach: there is no safe default, and guessing
// would run a host command inside a sandbox or vice versa.
enum ServiceLocation {
  SERVICE_LOCATION_UNSPECIFIED = 0;
  SERVICE_LOCATION_IN_SANDBOX = 1;
  SERVICE_LOCATION_ON_HOST = 2;
}

// FR-047. RUNNING is a claim about REACHABILITY, not about process launch: the
// daemon sets it only after a successful dial of the host endpoint.
enum ServiceState {
  SERVICE_STATE_UNSPECIFIED = 0;
  SERVICE_STATE_STOPPED = 1;
  SERVICE_STATE_STARTING = 2;
  SERVICE_STATE_RUNNING = 3;
  SERVICE_STATE_FAILED = 4;
}

// FR-051: every failure carries a reason, never silently dropped.
enum ServiceFailureReason {
  SERVICE_FAILURE_REASON_UNSPECIFIED = 0;
  SERVICE_FAILURE_REASON_LAUNCH_FAILED = 1;          // could not start the command
  SERVICE_FAILURE_REASON_PORT_IN_USE = 2;            // effective port already held
  SERVICE_FAILURE_REASON_NOT_LISTENING = 3;          // readiness window elapsed, nothing listening
  SERVICE_FAILURE_REASON_NOT_LISTENING_LOOPBACK = 4; // bound to loopback only (research R5)
  SERVICE_FAILURE_REASON_EXITED_EARLY = 5;           // exited before becoming ready
  SERVICE_FAILURE_REASON_EXITED_UNEXPECTEDLY = 6;    // exited after reaching RUNNING
  SERVICE_FAILURE_REASON_SANDBOX_NOT_RUNNING = 7;    // in-sandbox start with the sandbox stopped
  SERVICE_FAILURE_REASON_NO_LOCAL_PORT = 8;          // no free port on the developer's machine
  SERVICE_FAILURE_REASON_HOST_UNREACHABLE = 9;       // remote host path lost while running
}

// ClientKind distinguishes attachments to a persistent terminal session so the
// daemon can enforce one-EXTERNAL-per-sandbox and count attachments (feature 003).
enum ClientKind {
  CLIENT_KIND_UNSPECIFIED = 0;
  CLIENT_KIND_IN_TUI = 1;    // the in-place Bubble Tea terminal view (US2)
  CLIENT_KIND_EXTERNAL = 2;  // an `sxb attach` external terminal (US3)
}

// --- MCP gateway (feature 008) ---

// How attach-by-default servers reach a launching sandbox (FR-100).
enum McpAttachMode {
  MCP_ATTACH_MODE_UNSPECIFIED = 0;   // reads as ADDITIVE
  MCP_ATTACH_MODE_ADDITIVE    = 1;   // dynamic gateway; marked servers loaded after create (default)
  MCP_ATTACH_MODE_EXCLUSIVE   = 2;   // static pre-load of the marked set; no discovery
}

enum McpServerKind {
  MCP_SERVER_KIND_UNSPECIFIED = 0;
  MCP_SERVER_KIND_REMOTE      = 1;   // remote endpoint URL
  MCP_SERVER_KIND_LOCAL       = 2;   // host-launched (command or OCI package)
}

enum McpAuthState {
  MCP_AUTH_STATE_UNSPECIFIED    = 0;
  MCP_AUTH_STATE_NOT_APPLICABLE = 1; // local servers
  MCP_AUTH_STATE_AUTHORIZED     = 2;
  MCP_AUTH_STATE_UNAUTHORIZED   = 3;
  MCP_AUTH_STATE_UNKNOWN        = 4; // status query failed; never fails the list
}

// --- Orchestrator (feature 009) ---

enum ActionType {
  ACTION_TYPE_UNSPECIFIED = 0;   // rejected at save
  ACTION_TYPE_PROMPT      = 1;   // runs on a free worker satisfying the requirements (FR-122)
  ACTION_TYPE_REASON      = 2;   // runs on the reasoning sandbox (FR-141)
}

// FR-125. In flight = RUNNING | AWAITING_INPUT | AWAITING_REVIEW.
enum RunState {
  RUN_STATE_UNSPECIFIED     = 0;
  RUN_STATE_QUEUED          = 1;
  RUN_STATE_RUNNING         = 2;
  RUN_STATE_AWAITING_INPUT  = 3;
  RUN_STATE_AWAITING_REVIEW = 4;   // agent idle, no completion report (FR-156)
  RUN_STATE_COMPLETED       = 5;
  RUN_STATE_FAILED          = 6;
  RUN_STATE_CANCELLED       = 7;
}

// FR-128: who called the action.
enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_USER        = 1;   // the developer, via the arguments form
  EVENT_KIND_TIMED       = 2;   // a timed event; origin = event id
  EVENT_KIND_TRIGGERED   = 3;   // a worker's or the reasoning sandbox's agent; origin = sandbox id
}

// Derived, never stored (Key Entities: Sandbox availability).
enum WorkerAvailability {
  WORKER_AVAILABILITY_UNSPECIFIED     = 0;
  WORKER_AVAILABILITY_FREE            = 1;   // running, agent idle, no run recorded
  WORKER_AVAILABILITY_BUSY            = 2;   // agent working (for the orchestrator or the developer)
  WORKER_AVAILABILITY_AWAITING_INPUT  = 3;
  WORKER_AVAILABILITY_AWAITING_REVIEW = 4;
  WORKER_AVAILABILITY_NOT_RUNNING     = 5;   // stopped, error, creating
  WORKER_AVAILABILITY_UNREACHABLE     = 6;   // owning daemon's link is down
}

// ---------- Core messages ----------

message AgentSpec {
  string kind = 1;            // e.g. "claude-code"
  repeated string args = 2;
  string model = 3;
}

message SourceRef {
  string path = 1;            // host-side absolute path (FR-007)
  bool is_repo = 2;           // clone only valid when all sources are repos (FR-008)
}

// A frozen copy of the client-side Configuration, sent on launch and stored in the
// daemon registry as config_snapshot (FR-002b, FR-012d). kit_options carry the full
// sbx option set (FR-014); values are JSON-encoded scalars/lists for option fidelity.
message ConfigSnapshot {
  string name = 1;                       // becomes default sandbox label (FR-012e)
  map<string, string> kit_options = 2;   // option key -> JSON-encoded value
  SeedingMode seeding_mode = 3;
  AgentSpec agent = 4;                   // empty => client/user chooses at launch (FR-016b)
}

message AgentSession {
  AgentSpec spec = 1;
  AgentStatus status = 2;
  google.protobuf.Timestamp last_event_at = 3;
  bool pty_attached = 4;
}

message Sandbox {
  string id = 1;                         // unique auto id (FR-012e)
  string display_name = 2;               // default = config label; user-overridable
  SandboxState state = 3;
  string host_id = 4;
  ConfigSnapshot config_snapshot = 5;
  string config_label = 6;
  repeated SourceRef sources = 7;
  SeedingMode seeding_mode = 8;
  string workspace_path = 9;             // retained verbatim copy location
  string container_ref = 10;             // sbx/Docker handle (re-adoption, FR-002a)
  AgentSession agent = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  string error = 14;                     // populated when state == ERROR
  // --- feature 003 ---
  string tag = 15;                       // mutable, non-unique purpose label (FR-021..024); persisted
  int32 attached_terminals = 16;         // derived: live terminal-session attachment count (FR-007/008)
  bool external_attached = 17;           // derived: an EXTERNAL attachment exists (FR-014/015)
  // --- feature 004 ---
  // Resolved `--kit` sources attached at create + via AddSandboxKit; persisted.
  // Kept resolvable (not just display labels) so a container recreate can re-attach
  // them — sbx honours `--kit` only at creation, so a relaunch that dropped these
  // would silently hand back a differently-provisioned sandbox.
  repeated string kits = 18;
  // --- feature 005 ---
  // RESOLVED escape-hatch command set = union of attached kits' commands, later-kit-
  // wins on name collision. Persisted so the allowlist is enforceable, a container
  // recreate replays it, and refresh can re-inject the rule + wrapper. This — not the
  // opaque `kits` list — is what the invocation endpoint validates against (FR-036).
  repeated EscapeHatchCommand escape_hatch_commands = 19;
  // --- feature 006 ---
  // RESOLVED service set = union of attached kits' services, later-kit-wins on
  // name collision. Persisted so the startable set is enforceable (FR-044/FR-045)
  // and a container recreate replays it. This — not the opaque `kits` list — is
  // what StartSandboxService validates a name against.
  repeated KitService services = 20;
  // --- feature 008 ---
  // Exactly the MCP servers switchboard attached at launch (post-reconcile) and
  // the daemon's attach mode at that moment. Fixed for the sandbox's life
  // (FR-082); never re-applied by restart/refresh. Agent self-attachments in
  // additive mode are not recorded.
  repeated string mcp_servers = 21;
  McpAttachMode mcp_attach_mode = 22;
  // --- feature 009 ---
  // Recorded by this sandbox's OWNING daemon when an orchestrator attaches it as
  // a worker (or launches it as its reasoning sandbox). Absent => not a worker.
  // The per-worker gateway token is daemon-local (bucket `worker_tokens`) and
  // NEVER carried here (I-C4).
  SandboxController controller = 23;
}

// ---------- Agent kits (feature 004) ----------

// KitSpec is a kit authored client-side. The client owns kit storage (mirroring
// configs, FR-002c) and renders the spec.yaml itself; the daemon writes spec_yaml
// verbatim into <kit_root>/<id>/spec.yaml so the host `sbx` can consume it as a
// local-path kit source. Keeping the wire payload the rendered YAML (rather than a
// structured mirror of Docker's schema) means the experimental kit schema can
// evolve without a contract change — the host `sbx` stays the authority on what
// is valid, via ValidateKit.
message KitSpec {
  string id = 1;         // client-side kit id; also the materialized directory name
  string spec_yaml = 2;  // full spec.yaml content
  // feature 005: structured, switchboard-owned escape-hatch commands. NOT rendered
  // into spec_yaml — the host `sbx` never sees them; the daemon enforces + runs them.
  // Present only on client-authored kits (KitRef.spec); external `source` kits carry none.
  repeated EscapeHatchCommand escape_hatch = 3;
  // feature 006: structured, switchboard-owned service declarations. Also NOT
  // rendered into spec_yaml; persisted client-side in kits/<id>/services.yaml.
  repeated KitService services = 4;
}

// KitRef selects a kit either by inline authored spec or by an external source
// string that the host `sbx` resolves itself.
message KitRef {
  oneof ref {
    KitSpec spec = 1;    // authored client-side, materialized on the daemon host
    // External source, resolved by sbx: local path | .zip | git+https://…#ref=&dir=
    // | OCI ref (ghcr.io/org/kit:1.0).
    string source = 2;
  }
}

message ValidateKitRequest { KitSpec kit = 1; }
message ValidateKitResponse {
  bool ok = 1;
  repeated string errors = 2;    // `sbx kit validate` diagnostics (empty when ok)
  repeated string warnings = 3;  // e.g. deprecated-field warnings from sbx
}

message AddSandboxKitRequest {
  string sandbox_id = 1;
  KitRef kit = 2;
}

// ---------- Escape hatch (feature 005) ----------

// EscapeHatchCommand: one authorized command declared on a kit. The `command`
// string is the FIXED, trusted prefix. A command MAY additionally allow the agent
// to supply arguments (constrained by `subcommands` OR `args_pattern`) and to pick
// a target workspace (constrained by `workspaces`). Any agent-supplied argument is
// passed as positional parameters (`sh -c '<command> "$@"' … <args>`), never
// re-parsed as shell syntax — so a loose pattern broadens which arguments reach the
// fixed tool but cannot inject shell metacharacters. Carried on KitSpec and, once
// resolved, on Sandbox.
message EscapeHatchCommand {
  string name = 1;                  // stable, kebab-case; unique within a kit; the allowlist key
  string command = 2;              // fixed, trusted command prefix, run via `sh -c`
  string when_to_use = 3;          // plain-language guidance for the injected rule
  ConsentMode consent_mode = 4;
  string working_dir = 5;          // optional, workspace-relative (no escape past root); default dir when `workspaces` is empty
  uint32 max_duration_seconds = 6; // optional; 0 => daemon default (30 min)
  // Agent-supplied arguments (feature 005 enhancement). At most ONE of the two may
  // be set; both empty => the command takes no agent arguments (the original fixed
  // behavior).
  repeated string subcommands = 7; // allowed exact argument strings the agent may choose (friendly form)
  string args_pattern = 8;         // anchored regex the agent's argument string must fully match (power form)
  // Targetable workspaces (feature 005 enhancement). Each entry is a
  // workspace-relative literal path OR a glob (e.g. "src/apps/*"). Empty => the
  // command runs in `working_dir` and the agent may not pick a workspace.
  repeated string workspaces = 9;
}

// EscapeHatchRun: one execution triggered by the agent. In-memory, session-scoped.
// `output` is bounded (<=1 MiB) and may be truncated.
message EscapeHatchRun {
  string id = 1;                   // ehr-<seq>
  string sandbox_id = 2;
  string command_name = 3;
  string command = 4;             // the fixed command prefix that ran (audit)
  EscapeHatchRunStatus status = 5;
  int32 exit_status = 6;          // set for SUCCEEDED/FAILED
  string output = 7;              // bounded, captured stdout+stderr
  bool output_truncated = 8;
  google.protobuf.Timestamp started_at = 9; // execution start (post-approval)
  google.protobuf.Timestamp ended_at = 10;  // terminal outcome
  string args = 11;               // agent-supplied arguments that ran (audit; empty if none)
  string working_dir = 12;        // resolved workspace-relative dir it ran in (audit; empty = workspace root)
}

message DecideEscapeHatchRunRequest {
  string run_id = 1;
  bool approved = 2;              // false = deny; anything but an explicit true is deny-by-default
}
message DecideEscapeHatchRunResponse {
  EscapeHatchRunStatus status = 1; // resolved status after applying the decision
}

message ListEscapeHatchRunsRequest { string sandbox_id = 1; } // empty => all sandboxes on this host
message ListEscapeHatchRunsResponse { repeated EscapeHatchRun runs = 1; }

// ---------- Port forwarding (feature 006) ----------

// KitService: one long-running service declared on a kit (FR-043). Like
// EscapeHatchCommand, this is switchboard-owned structured data — it is NOT
// rendered into the opaque Docker spec.yaml, and the host `sbx` never sees it.
// Carried on KitSpec and, once resolved, on Sandbox.
message KitService {
  string name = 1;         // kebab-case; unique within the kit; the allowlist key
  string command = 2;      // run via `sh -c`; may contain the {{port}} token (research R4)
  uint32 listen_port = 3;  // 1..65535 — what the command binds IN ITS OWN environment
  ServiceLocation location = 4;
  bool is_website = 5;     // enables the browser-open action; else a copyable address
  string working_dir = 6;  // optional, workspace-relative (no escape past root)
  uint32 readiness_timeout_seconds = 7; // 0 => daemon default (60s)
}

// ServiceInstance: one execution attempt of a KitService for one sandbox.
// In-memory and session-scoped (research R7) — a daemon restart leaves no
// instance running and none claiming to be (FR-045, SC-005).
message ServiceInstance {
  string id = 1;                  // svc-<seq>
  string sandbox_id = 2;
  string service_name = 3;        // resolves against Sandbox.services (the allowlist check)
  ServiceState state = 4;
  // What the command actually binds. Equals listen_port except for an on-host
  // service whose command uses {{port}}, where the daemon allocates a free host
  // port so concurrent sandboxes do not collide (research R4).
  uint32 effective_port = 5;
  uint32 host_endpoint_port = 6;  // port on the DAEMON HOST that ForwardPort dials
  uint32 local_port = 7;          // port on the DEVELOPER'S MACHINE; 0 while not forwarded
  ServiceFailureReason failure_reason = 8;
  string failure_detail = 9;      // human-readable; names the remedy where one exists
  string output = 10;             // bounded 1 MiB, TAIL-retained (research R9)
  bool output_truncated = 11;
  google.protobuf.Timestamp started_at = 12;
  google.protobuf.Timestamp ended_at = 13;
}

// One row of the per-sandbox service list: the declaration joined with its
// current instance (absent => never started this session).
message SandboxService {
  KitService declared = 1;
  ServiceInstance instance = 2;   // unset => STOPPED, never started
}

message ListSandboxServicesRequest { string sandbox_id = 1; }
message ListSandboxServicesResponse { repeated SandboxService services = 1; }

message StartSandboxServiceRequest {
  string sandbox_id = 1;
  string service_name = 2;
}
message StartSandboxServiceResponse { ServiceInstance instance = 1; }

message StopSandboxServiceRequest {
  string sandbox_id = 1;
  string service_name = 2;
}
message StopSandboxServiceResponse { ServiceInstance instance = 1; }

// PortForwardFrame is one message on the ForwardPort byte relay (research R1).
// One stream per accepted TCP connection on the developer's machine:
//
//   client                                   daemon
//   ──────────────────────────────────────────────────────────────────
//   open{instance_id, local_port}   ──────►  dial 127.0.0.1:<host_endpoint_port>
//                                   ◄──────  opened{} | error status
//   data ◄──────────────────────────────────► data          (until either closes)
//
// The first client frame MUST be `open`; anything else is INVALID_ARGUMENT. The
// daemon rejects an instance that is not RUNNING (FAILED_PRECONDITION), which is
// what stops a stale client from presenting a dead address as working.
message PortForwardFrame {
  oneof frame {
    Open open = 1;       // client -> daemon, first frame only
    Opened opened = 2;   // daemon -> client, once, after a successful dial
    bytes data = 3;      // both directions
    Closed closed = 4;   // either direction; carries a reason when abnormal
  }
  message Open {
    string instance_id = 1;
    uint32 local_port = 2;   // the port the client bound on the developer's machine
  }
  message Opened {}
  message Closed { string reason = 1; }  // empty => normal half-close
}

// ---------- RPC payloads ----------

message GetDaemonInfoRequest {}
message DaemonInfo {
  string host_id = 1;
  string hostname = 2;
  string daemon_version = 3;
  string sbx_version = 4;
  string workspace_root = 5;             // controlled folder for duplicates (FR-006)
  // --- feature 008 (FR-096 / FR-079) ---
  string sbx_min_version = 6;            // the daemon's declared runtime baseline
  bool   runtime_baseline_met = 7;       // parsed `sbx version` >= sbx_min_version
  bool   mcp_gateway_available = 8;      // baseline met AND `sbx mcp` usable AND signed in
  string mcp_gateway_reason = 9;         // why not, when unavailable
}

// UpdateDaemonRequest asks the daemon to self-update to an exact release tag so
// the client and every host converge on one version. Empty means "latest".
message UpdateDaemonRequest {
  string target_version = 1;             // e.g. "v0.4.1"; empty = latest
}

// UpdateProgress is streamed as the daemon downloads, verifies, and applies the
// new binary. The stream ends (with done=true, or a set error) just before the
// daemon restarts.
message UpdateProgress {
  string stage = 1;        // "checking" | "downloading" | "verifying" | "applying" | "restarting" | "done"
  string message = 2;      // human-readable detail
  bool   done = 3;         // terminal success
  string error = 4;        // set on failure; nothing was swapped
  string new_version = 5;  // set on done: the version now installed
}

message GetOptionManifestRequest {}
message OptionManifest {
  string sbx_version = 1;
  repeated Option options = 2;           // every sbx option (FR-014)
  message Option {
    string key = 1;
    string type = 2;                     // bool | string | int | enum | list
    string description = 3;
    repeated string enum_values = 4;
    string default_value = 5;            // JSON-encoded
    bool required = 6;
  }
}

message ListSandboxesRequest {}
message ListSandboxesResponse { repeated Sandbox sandboxes = 1; }

message LaunchSandboxRequest {
  ConfigSnapshot config = 1;             // the launch config (with or without agent)
  repeated SourceRef sources = 2;        // selection for THIS launch (FR-007)
  AgentSpec agent_override = 3;          // used when config.agent is empty (FR-016b)
  string display_name = 4;               // optional custom name
  bool override_resource_warning = 5;    // proceed despite low-resource warning (FR-012f)
  // Kits to attach at creation (feature 004, FR-032), rendered as one `--kit <src>`
  // per entry. Creation time is the ONLY point `--kit` is accepted by sbx; use
  // AddSandboxKit for a sandbox that already exists.
  repeated KitRef kits = 6;
  // feature 009 (FR-110): from GetWorkerBundle — the sandbox is a worker of this
  // orchestrator from before its agent starts (registration + briefing applied
  // after create, before RUNNING). Applied by the owning daemon; a failure is
  // logged and never fails the launch.
  WorkerBundle controller = 7;
}

message LaunchProgress {
  oneof event {
    CopyProgress copy = 1;               // verbatim duplication progress (FR-028)
    string log_line = 2;                 // sbx stdout/stderr line
    Sandbox done = 3;                    // terminal: the created/running sandbox
    ResourceReport blocked = 4;          // returned instead of done when blocked w/o override
  }
  message CopyProgress {
    uint64 bytes_copied = 1;
    uint64 bytes_total = 2;
    string current_path = 3;
  }
}

message SandboxIdRequest { string sandbox_id = 1; }
message DestroyResponse { bool deleted_workspace = 1; }
message RenameSandboxRequest { string sandbox_id = 1; string display_name = 2; }

// feature 003: set/change/clear a sandbox's mutable purpose tag. Empty tag clears
// it. Returns the updated Sandbox (only `tag`/`updated_at` change).
message SetSandboxTagRequest { string sandbox_id = 1; string tag = 2; }

// ---------- Edit sandbox sources (feature 007) ----------

// AddSandboxSourcesRequest mirrors the launch surface deliberately: SourceRef
// carries the same {path, is_repo} the launch wizard captures (is_repo is
// advisory — clone-mode adds re-verify daemon-side), and
// override_resource_warning round-trips the LaunchProgress.blocked resource gate
// exactly as LaunchSandboxRequest does (FR-057).
message AddSandboxSourcesRequest {
  string sandbox_id = 1;
  repeated SourceRef sources = 2;          // >= 1; folder names must be unique in-batch
  bool override_resource_warning = 3;      // re-send with true after a `blocked` reply
}

// RemoveSandboxSourcesRequest identifies folders by the EXACT recorded
// SourceRef.path (the identity the record stores and the UI displays) — not by
// basename, not by index — so retries of a partially failed batch simply re-send
// the survivors.
message RemoveSandboxSourcesRequest {
  string sandbox_id = 1;
  repeated string source_paths = 2;        // >= 1; each must match a recorded source
}

// feature 003: resolve which sandbox owns a filesystem path (for `sxb` auto-open).
message ResolveWorkspaceRequest { string path = 1; }
message ResolveWorkspaceResponse {
  bool found = 1;
  string sandbox_id = 2;
  SandboxState state = 3;                // so the client can message "stopped" (FR-020)
}

message ListSourceCandidatesRequest {
  string root = 1;                       // directory to enumerate (default: a configured base)
  bool repos_only = 2;
}
message ListSourceCandidatesResponse { repeated SourceRef candidates = 1; }

message CheckResourcesRequest { repeated SourceRef sources = 1; }   // estimate copy size
message ResourceReport {
  bool ok = 1;
  uint64 required_bytes = 2;
  uint64 available_bytes = 3;
  repeated string warnings = 4;          // shown before launch; user may override (FR-012f)
}

message PromptAgentRequest { string sandbox_id = 1; string prompt = 2; }
message PromptAgentResponse { bool accepted = 1; }

message AgentInput {
  string sandbox_id = 1;                 // first message selects the sandbox
  bytes data = 2;                        // raw PTY bytes (keystrokes)
  Resize resize = 3;
  message Resize { uint32 cols = 1; uint32 rows = 2; }

  // attach is set only on the FIRST frame (feature 003). It declares the client
  // kind so the daemon can enforce one-EXTERNAL-per-sandbox and count attachments.
  AttachInfo attach = 4;
  message AttachInfo {
    ClientKind kind = 1;
    string client_label = 2;             // optional, diagnostics
    Resize initial_size = 3;             // client's starting window size
  }
}

// AgentOutput is either a one-shot Snapshot (first frame on attach) or a live
// `data` frame (feature 003). A frame with snapshot set carries no live data.
message AgentOutput {
  bytes data = 1;                        // live PTY output (screen)
  Snapshot snapshot = 2;                 // set only on the first frame after attach
  message Snapshot {
    bytes data = 1;                      // bytes to replay for an immediate redraw
    uint32 rows = 2;
    uint32 cols = 3;
    bytes scrollback = 4;                // reserved: bounded prior-output tail (FR-005)
  }
}

message SubscribeRequest {
  bool replay_undelivered = 1;           // replay missed notifications on reconnect (FR-026b)
}

message Event {
  oneof event {
    Sandbox sandbox_changed = 1;         // state/agent-status update
    NotificationEvent notification = 2;
    SandboxRemoved removed = 3;
    // feature 005: a run's state changed (created / approved / running / terminal).
    // Drives the list-page badge, the approval modal, and the inbox.
    EscapeHatchRun escape_hatch_run = 4;
    // feature 006: a service instance's state changed. Drives the per-sandbox
    // service list, the sandbox-list running indicator, and the inbox.
    ServiceInstance service_instance = 5;
    // feature 008: a daemon's gateway registrations, marks or attach mode changed.
    // Clients with that daemon's gateway view open re-list (research R10).
    McpGatewayChanged mcp_gateway_changed = 6;
    // A daemon's secret store changed (set/remove) (FR-104).
    SecretsChanged secrets_changed = 7;
    // feature 009 (R14): an orchestrator hosted by host_id changed (record,
    // actions, events, hosts, roster) or one of its runs transitioned. Clients
    // re-fetch its summary and whichever view is open.
    OrchestratorChanged orchestrator_changed = 8;
  }
  message SandboxRemoved { string sandbox_id = 1; }
  message McpGatewayChanged { string host_id = 1; }
  message SecretsChanged { string host_id = 1; }
  message OrchestratorChanged { string host_id = 1; string orchestrator_id = 2; }
}

message NotificationEvent {
  string id = 1;
  string sandbox_id = 2;
  string host_id = 3;                    // subject host (FR-026)
  NotificationKind kind = 4;
  string message = 5;
  google.protobuf.Timestamp created_at = 6;
}

message AckNotificationRequest { repeated string notification_ids = 1; }
message AckNotificationResponse { uint32 acked = 1; }

// Client builds:  vscode-remote://attached-container+hex({"containerName":"/<name>"})<path>
// (set DOCKER_HOST=ssh://<ssh_target> first for remote hosts). See research.md.
message VSCodeTarget {
  string container_name = 1;             // canonical "/name" form (leading slash)
  string workspace_path = 2;             // absolute path inside the container
  string ssh_target = 3;                 // non-empty for remote hosts => DOCKER_HOST=ssh://...
}

// ---------- MCP gateway (feature 008) ----------

message McpServer {
  string name = 1;
  McpServerKind kind = 2;
  string target = 3;                     // URL / command line when the runtime shows one ("" otherwise)
  McpAuthState auth_state = 4;
  bool attach_by_default = 5;            // switchboard-owned mark (FR-080)
  // Verbatim columns of the real `sbx mcp ls` table (reconciled 2026-10-10:
  // NAME / TRANSPORT / STATUS / GATEWAY / DETAIL — no URL column):
  string transport = 6;                  // e.g. "remote http"
  string status_text = 7;                // e.g. "needs auth"
  string detail = 8;                     // e.g. "sbx mcp auth notion"
}

// Persisted per daemon in the registry's `mcp` bucket (research R3).
message McpGatewaySettings {
  McpAttachMode default_attach_mode = 1;
  map<string, bool> marks = 2;           // server name -> attach by default
}

message ListMcpServersRequest {}
message ListMcpServersResponse {
  repeated McpServer servers = 1;
  McpGatewaySettings settings = 2;
}

message AddMcpServerRequest {
  string name = 1;
  oneof definition {
    string url = 2;                      // remote endpoint
    LocalCommand command = 3;            // host-run stdio server
  }
  bool attach_by_default = 4;
  bool acknowledge_local_execution = 5;  // required for `command` (FR-076)
  // Custom HTTP headers for a remote endpoint, each "Name: value" → one
  // `--header` flag (FR-103). Credential headers use a `${placeholder}` whose
  // value is the host secret `mcp:<name>:<placeholder>` (see Secrets).
  repeated string headers = 6;
  message LocalCommand {
    string command = 1;
    repeated string args = 2;
    string dir = 3;                      // optional working directory
  }
}

message RemoveMcpServerRequest { string name = 1; }
message RemoveMcpServerResponse { repeated string notes = 1; }

message AuthorizeMcpServerRequest { string name = 1; }
message McpAuthProgress {
  oneof event {
    string url = 1;                      // open where YOU are; never auto-opened on the host
    string message = 2;                  // runtime progress line
    McpAuthState done = 3;               // terminal: AUTHORIZED, or UNAUTHORIZED on timeout/cancel/failure
    string error = 4;                    // terminal: host diagnostic (registration unchanged)
  }
  int64 deadline_unix = 5;               // on every frame so the client can show time remaining
}

message SetMcpServerDefaultRequest { string name = 1; bool attach_by_default = 2; }
message SetMcpAttachModeRequest { McpAttachMode mode = 1; }
message AttachMcpServerRequest { string sandbox_id = 1; string name = 2; }

// Secret is one row of `sbx secret ls`: scope ("global" or a sandbox name), the
// runtime's type ("service", "registry", "custom"; "service" when the host's
// table has no TYPE column), the name (service id, `mcp:<server>:<placeholder>`,
// or registry host), and the masked value exactly as the runtime prints it.
message Secret {
  string scope = 1;
  string type = 2;
  string name = 3;
  string masked_value = 4;
}
message ListSecretsRequest {}
message ListSecretsResponse { repeated Secret secrets = 1; }
// SetSecretRequest: value is the plaintext (required); sandbox scopes the secret
// to one sandbox by its runtime name, "" = global.
message SetSecretRequest { string name = 1; string value = 2; string sandbox = 3; }
// RemoveSecretRequest: type "registry" removes a registry credential keyed by
// host; anything else removes a service secret by name.
message RemoveSecretRequest { string name = 1; string sandbox = 2; string type = 3; }
message RemoveSecretResponse {}

// ---------- Orchestrator (feature 009) ----------

// Recorded on the sandbox by its OWNING daemon (Key Decision 5). Absent => not a
// worker. The TUI hides a sandbox with a controller unless it needs the developer
// (agent NEEDS_INPUT or run.needs_review), orders those first, and labels rows
// with `name` (FR-113/114/149).
message SandboxController {
  string orchestrator_id = 1;            // stable opaque identity (FR-148)
  string name = 2;                       // last-known display name; refreshed by UpdateWorker
  string host_id = 3;                    // the orchestrator's machine (where MarkWorkerFree is called)
  google.protobuf.Timestamp attached_at = 4;
  bool reasoning = 5;                    // this sandbox is the orchestrator's reasoning sandbox (FR-145)
  WorkerRun run = 6;                     // the run currently on the sandbox; unset when none
}
message WorkerRun {
  string id = 1;
  string action = 2;
  bool needs_review = 3;                 // set by the orchestrator when the run is AWAITING_REVIEW
}

message WorkerBundle {
  SandboxController controller = 1;      // identity, name, host; `run` unset
  string briefing = 2;                   // the managed CLAUDE.md block body (R12)
}

// One machine the orchestrator dials (FR-106): the TUI's KnownHost shape minus
// any password; keyed by the remote daemon's advertised host_id.
message OrchestratorHost {
  string host_id = 1;
  string display_name = 2;
  string ssh_target = 3;                 // user@host[:port] as `ssh` accepts it
  repeated string ssh_options = 4;       // extra `-o`/`-i` arguments, verbatim
  bool reachable = 5;                    // derived: the link is up
  string error = 6;                      // derived: last dial error when down
}

message ActionArgument {
  string name = 1;                       // [A-Za-z_][A-Za-z0-9_]*; unique within the action
  string description = 2;
  bool required = 3;
  string default_value = 4;              // optional arguments only
}

// A developer-authored recipe (FR-135..FR-141). Validated at save.
message Action {
  string name = 1;                       // [a-z0-9][a-z0-9-]* <= 64; unique within the orchestrator
  string description = 2;
  ActionType type = 3;
  string body = 4;                       // non-empty; placeholders are {name} (R8)
  repeated ActionArgument arguments = 5;
  string worker_tag = 6;                 // PROMPT only: eligible workers carry this Sandbox.tag
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// FR-130/FR-157. `dedupe_disabled` is stored negated so an absent field means
// the default: dedupe ON.
message TimedEvent {
  string id = 1;                         // tev-<seq>
  string name = 2;
  string action = 3;
  map<string, string> arguments = 4;     // fixed argument values
  uint32 interval_seconds = 5;           // >= 60
  bool enabled = 6;
  bool dedupe_disabled = 7;              // false = skip a firing while a run of this event is queued or in flight
  google.protobuf.Timestamp next_fire_at = 8;
  google.protobuf.Timestamp last_fired_at = 9;
  google.protobuf.Timestamp last_skipped_at = 10;
  uint32 skipped_count = 11;
  string disabled_reason = 12;           // e.g. "action review-pr was deleted"
}

// The reasoning sandbox's setup (FR-146): the launch wizard's own fields. Empty
// => the default empty context (FR-147).
message ReasoningSetup {
  repeated SourceRef sources = 1;
  ConfigSnapshot config = 2;
  repeated KitRef kits = 3;
  repeated string mcp_servers = 4;       // registered names on the orchestrator's host
}

// Roster entry (persisted on the orchestrator; the owning daemon's record is the
// authority — the roster is re-derived from it on every reconcile, R6).
message Worker {
  string sandbox_id = 1;
  string host_id = 2;
  google.protobuf.Timestamp attached_at = 3;
  bool reasoning = 4;
}

// Persisted in the registry's `orchestrators` bucket (R9).
message Orchestrator {
  string id = 1;                         // uuid; never changes (FR-148)
  string name = 2;                       // unique among orchestrators on this daemon
  string host_id = 3;                    // the hosting daemon's host id
  google.protobuf.Timestamp created_at = 4;
  repeated OrchestratorHost hosts = 5;
  repeated Action actions = 6;
  repeated TimedEvent timed_events = 7;
  ReasoningSetup reasoning_setup = 8;
  string reasoning_sandbox_id = 9;       // "" until launched
  repeated Worker workers = 10;
}

message OrchestratorSummary {
  Orchestrator orchestrator = 1;
  uint32 worker_count = 2;
  uint32 queued = 3;
  uint32 in_flight = 4;
  uint32 awaiting_review = 5;
  bool reasoning_ready = 6;              // the reasoning sandbox exists on this host
  string reasoning_error = 7;            // why not, when it does not
}

// A worker as the Workers view and the Orchestrator Sandboxes tab show it (FR-132/FR-115).
message WorkerView {
  string sandbox_id = 1;
  string host_id = 2;
  string display_name = 3;
  string tag = 4;
  SandboxState state = 5;
  AgentStatus agent_status = 6;
  WorkerAvailability availability = 7;
  string run_id = 8;                     // run on it, when any
  string run_action = 9;
  bool reasoning = 10;
  bool host_reachable = 11;
}

// One call of an action (FR-125). `prompt` is the composed prompt, frozen at
// call time; delivery wraps it in the documented run frame (R12), which is not
// recorded. `position` is derived (1-based) for QUEUED runs.
message Run {
  string id = 1;                         // run-<orchestrator8>-<seq>
  string orchestrator_id = 2;
  string action = 3;
  ActionType type = 4;
  map<string, string> arguments = 5;
  string prompt = 6;
  EventKind event_kind = 7;
  string origin = 8;                     // event id | calling sandbox id | "" for USER
  string origin_label = 9;               // event name | sandbox display name | ""
  google.protobuf.Timestamp received_at = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp ended_at = 12;
  RunState state = 13;
  string sandbox_id = 14;                // the sandbox it ran on, once started
  string sandbox_host_id = 15;
  string summary = 16;                   // the completion report's summary, or the developer's note
  bool closed_by_developer = 17;         // MarkWorkerFree closed it (FR-156)
  string reason = 18;                    // outcome reason for FAILED/CANCELLED
  uint32 position = 19;
}

// OrchestratorLinkFrame is one message on the call relay (research R6). One
// stream per (orchestrator, host entry), opened by the ORCHESTRATOR'S daemon:
//
//   orchestrator daemon (M)                      worker daemon (N)
//   ──────────────────────────────────────────────────────────────────
//   hello{orchestrator_id, name}  ───────────►   index link by orchestrator id
//                                 ◄───────────   call{id, sandbox_id, tool, args_json}
//                                                 (a worker's gateway call, attributed by N)
//   result{id, ok, body_json, error} ─────────►   returned to the agent as the tool result
//   ping{}  ◄──────────────────────────────────►  every 30 s, both ways
//
// The first client frame MUST be `hello`; anything else is INVALID_ARGUMENT. A
// `call` with no `result` within linkCallTimeout (10 s) answers the agent with
// "orchestrator <name> is unreachable; retry". Only one link per
// (orchestrator, N) is live; a newer `hello` for the same orchestrator replaces
// the older stream.
message OrchestratorLinkFrame {
  oneof frame {
    Hello hello = 1;                     // orchestrator -> worker daemon, first frame only
    Call call = 2;                       // worker daemon -> orchestrator
    Result result = 3;                   // orchestrator -> worker daemon
    Ping ping = 4;                       // both directions
  }
  message Hello { string orchestrator_id = 1; string name = 2; }
  message Call {
    string id = 1;                       // unique per link
    string sandbox_id = 2;               // the attributed caller (R4)
    string tool = 3;                     // orchestrator_list_actions | orchestrator_call_action | orchestrator_check_run | orchestrator_report_completion
    string args_json = 4;                // the tool's input object, JSON
  }
  message Result {
    string id = 1;
    bool ok = 2;
    string body_json = 3;                // the tool's output object, JSON (when ok)
    string error = 4;                    // the refusal reason (when !ok)
  }
  message Ping {}
}

// --- orchestrator-side payloads ---

message ListOrchestratorsRequest {}
message ListOrchestratorsResponse { repeated OrchestratorSummary orchestrators = 1; }
message OrchestratorIdRequest { string orchestrator_id = 1; }
message OrchestratorDetail {
  OrchestratorSummary summary = 1;
  repeated WorkerView workers = 2;       // workers and the reasoning sandbox
  repeated OrchestratorHost hosts = 3;   // with reachability
}
message CreateOrchestratorRequest { string name = 1; }
message RenameOrchestratorRequest { string orchestrator_id = 1; string name = 2; }
message RemoveOrchestratorResponse { uint32 workers_detached = 1; uint32 runs_failed = 2; uint32 runs_cancelled = 3; }
message SetOrchestratorHostsRequest { string orchestrator_id = 1; repeated OrchestratorHost hosts = 2; }

message GetWorkerBundleRequest { string orchestrator_id = 1; }
message AttachWorkerRequest { string orchestrator_id = 1; string host_id = 2; string sandbox_id = 3; }
message DetachWorkerRequest { string orchestrator_id = 1; string sandbox_id = 2; }
message DetachWorkerResponse {}
message MarkWorkerFreeRequest {
  string orchestrator_id = 1;
  string sandbox_id = 2;
  bool failed = 3;                       // false => COMPLETED (the default)
  string note = 4;                       // optional; recorded as the run's summary
}

message PutActionRequest { string orchestrator_id = 1; Action action = 2; }
message DeleteActionRequest { string orchestrator_id = 1; string name = 2; }
message DeleteActionResponse { repeated string disabled_events = 1; }
message PutTimedEventRequest { string orchestrator_id = 1; TimedEvent event = 2; }   // empty id => create
message DeleteTimedEventRequest { string orchestrator_id = 1; string event_id = 2; }
message DeleteTimedEventResponse {}

message CallActionRequest {
  string orchestrator_id = 1;
  string action = 2;
  map<string, string> arguments = 3;
}
message ListRunsRequest { string orchestrator_id = 1; }
message ListRunsResponse {
  repeated Run queued = 1;               // in order, with position
  repeated Run in_flight = 2;            // RUNNING, AWAITING_INPUT, AWAITING_REVIEW
  repeated Run history = 3;              // COMPLETED, FAILED, CANCELLED; newest first
}
message GetRunRequest { string orchestrator_id = 1; string run_id = 2; }
message CancelRunRequest { string orchestrator_id = 1; string run_id = 2; }
message RebuildReasoningSandboxRequest {
  string orchestrator_id = 1;
  ReasoningSetup setup = 2;              // when set: saved as the new setup first
}

// --- worker-side payloads ---

message AttachControllerRequest {
  string sandbox_id = 1;
  SandboxController controller = 2;      // identity, name, host, reasoning; `run` ignored
  string briefing = 3;
}
message DetachControllerRequest { string sandbox_id = 1; string orchestrator_id = 2; bool force = 3; }
message UpdateWorkerRequest {
  string sandbox_id = 1;
  string orchestrator_id = 2;            // must match the recorded controller
  optional string name = 3;              // new last-known name
  bool set_run = 4;                      // when true, `run` replaces controller.run (unset run => clear)
  WorkerRun run = 5;
  optional string briefing = 6;          // rewrite the managed block
}
message DeliverWorkerPromptRequest {
  string sandbox_id = 1;
  string orchestrator_id = 2;
  string run_id = 3;
  string action = 4;
  string prompt = 5;                     // the COMPOSED prompt; the daemon applies the run frame
}
message DeliverWorkerPromptResponse { bool accepted = 1; }
